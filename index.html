<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/src/styles/app.css">
</head>
<body>
<canvas id="out" aria-label="Artboard"></canvas>
<div class="empty" id="empty"><button class="glass" id="emptyUpload" aria-label="Upload an image"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2" />  <circle cx="9" cy="9" r="2" />  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg></button><span>Upload an image or video</span><div class="recent" id="recent" hidden></div><button class="recent-all" id="recentAll" hidden>All photos</button></div>
<p class="toast glass" id="toast" hidden></p>
<input id="file" type="file" accept="image/*,video/*" hidden>

<div class="vbar glass ui hidden" id="vbar"><button id="vplay" aria-label="Play" hidden></button><button id="vrec" aria-label="Record video" hidden></button><button id="vlib" aria-label="Library"></button><button id="vreset" aria-label="Reset all settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H3" />  <path d="M7 12H3" />  <path d="M7 19H3" />  <path d="M12 18a5 5 0 0 0 9-3 4.5 4.5 0 0 0-4.5-4.5c-1.33 0-2.54.54-3.41 1.41L11 14" />  <path d="M11 10v4h4" /></svg></button><button id="vupload" aria-label="Upload image or video"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21" />  <path d="m14 19.5 3-3 3 3" />  <path d="M17 22v-5.5" />  <circle cx="9" cy="9" r="2" /></svg></button><button id="vcrop" aria-label="Crop"></button><button id="vshuffle" aria-label="Shuffle"></button><button id="vsave" aria-label="Save style"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z" /><line x1="12" x2="12" y1="7" y2="13" /><line x1="15" x2="9" y1="10" y2="10" /></svg></button><button id="vdown" aria-label="Download"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3" />  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />  <path d="m7 10 5 5 5-5" /></svg></button><button id="vmenu" aria-label="Menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6" /><line x1="4" x2="20" y1="12" y2="12" /><line x1="4" x2="20" y1="18" y2="18" /></svg></button></div>
<div class="topL glass ui hidden" id="topL"></div>
<div class="xsheet hidden" id="xsheet" role="dialog" aria-label="Export">
  <div class="xhead"><span>Export</span><button id="xclose" aria-label="Close">×</button></div>
  <div class="seg" id="xkind"></div>
  <div class="xgroup" id="xfmtg"><div class="xlabel">Format</div><div class="seg" id="xfmt"></div></div>
  <div class="xgroup"><div class="xlabel">Size</div><div class="seg" id="xsize"></div></div>
  <p class="xinfo" id="xinfo"></p>
  <button class="xgo" id="xgo">Export</button>
</div>
<div class="xsheet hidden" id="library" role="dialog" aria-label="Library">
  <div class="xhead"><span>Library</span><button id="libClose" aria-label="Close">×</button></div>
  <div class="seg" id="libSeg"></div>
  <div class="xgroup" id="libSaveGroup">
    <div class="xlabel">Save current settings as a preset</div>
    <div class="lib-save-row">
      <input id="libSaveName" type="text" placeholder="Preset name" maxlength="40">
      <button id="libSaveBtn">Save</button>
    </div>
  </div>
  <div class="lib-list" id="libList"></div>
</div>
<div class="dock ui hidden" id="dock">
  <div class="slot slot-sw"><div class="swatches glass hidden" id="swatches"></div></div>
  <div class="title" id="title"></div>
  <div class="items" id="items"></div>
  <div class="slot slot-ctl">
    <div class="scrub hidden" id="scrub"><div class="strip" id="strip"></div><div class="mid"></div></div>
    <div class="chips hidden" id="chips"></div>
  </div>
  <nav class="tabs glass" id="tabs" role="tablist"></nav>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
