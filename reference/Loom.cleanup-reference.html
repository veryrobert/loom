<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Loom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --glass:rgba(28,28,30,.58); --glass-strong:rgba(28,28,30,.72); --edge:rgba(255,255,255,.14); --ink:#fff; --soft:rgba(255,255,255,.62);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --bg:#000; --ink:#fff; } }
:root[data-theme="dark"]{ --bg:#000; --ink:#fff; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px); background:var(--bg)}
body{margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--ink); font:400 13px/1.3 "Inter","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; -webkit-user-select:none; user-select:none}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid #fff; outline-offset:2px}
svg{display:block}
.glass{background:var(--glass); -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5); border:1px solid var(--edge)}
#out{position:fixed; display:block; touch-action:none}
.empty{position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--soft)}
.empty[hidden]{display:none}
.empty button{width:64px; height:64px; border-radius:50%; display:grid; place-items:center; color:#fff}
.ui{transition:opacity .45s ease}
body.hideui .ui{opacity:0; pointer-events:none}
.cbtn{position:relative; width:40px; height:40px; display:grid; place-items:center; border-radius:50%; cursor:pointer}
.cbtn input{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0; cursor:pointer}
.chip-dot{width:22px; height:22px; border-radius:50%; border:1.5px solid #fff}
.xsheet{position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 10px); transform:translateX(-50%); width:min(420px,calc(100vw - 20px)); border-radius:26px; padding:16px 18px 18px; z-index:8; background:rgba(22,22,24,.82); -webkit-backdrop-filter:blur(26px) saturate(1.5); backdrop-filter:blur(26px) saturate(1.5); border:1px solid rgba(255,255,255,.12)}
.xhead{display:flex; justify-content:space-between; align-items:center; font-size:17px; font-weight:500; margin:0 0 14px}
#xclose{width:30px; height:30px; border-radius:50%; background:rgba(255,255,255,.12); font-size:17px; line-height:1}
.seg{display:flex; gap:4px; padding:4px; border-radius:14px; background:rgba(255,255,255,.08)}
.seg button{flex:1; height:36px; border-radius:10px; color:rgba(255,255,255,.7); font-size:14px}
.seg button[aria-pressed="true"]{background:rgba(255,255,255,.95); color:#111; font-weight:500}
.seg button:disabled{opacity:.3; cursor:default}
#xkind{margin:0 0 14px}
.xgroup{margin:0 0 12px}
.xlabel{color:rgba(255,255,255,.55); font-size:12px; margin:0 0 6px 2px}
.xinfo{color:rgba(255,255,255,.62); font-size:12.5px; line-height:1.45; margin:4px 2px 14px; min-height:18px}
.xgo{width:100%; height:48px; border-radius:24px; background:#fff; color:#111; font-size:15px; font-weight:500}
.xgo:disabled{opacity:.4}
body.exporting .dock, body.exporting .topL{visibility:hidden}
.vbar{position:fixed; right:14px; top:calc(env(safe-area-inset-top,0px) + 12px); height:44px; border-radius:22px; display:flex; align-items:center; padding:0 6px; z-index:5}
.vbar button{width:40px; height:40px; display:grid; place-items:center; border-radius:50%}
.vbar button.on{background:#FF3B30; color:#fff}
.topL button.on,.topR button.on{background:rgba(255,255,255,.94); color:#111}
.topL,.topR{position:fixed; top:calc(env(safe-area-inset-top,0px) + 12px); height:44px; border-radius:22px; display:flex; align-items:center; padding:0 6px; z-index:5}
.topL{left:14px} .topR{right:14px}
.topL button,.topR button{width:40px; height:40px; display:grid; place-items:center; border-radius:50%}
.dock{position:fixed; left:0; right:0; bottom:0; padding-bottom:calc(env(safe-area-inset-bottom,0px) * 0.45 + 4px); z-index:5; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none}
.slot{position:relative; width:100vw; display:flex; justify-content:center; align-items:center}
.slot-sw{height:38px}
.slot-ctl{height:40px}
.slot-ctl > *{position:absolute; left:0; right:0; top:0; bottom:0; margin:auto}
.dock.closed .slot,.dock.closed .title,.dock.closed .items{visibility:hidden}
.dock > *{pointer-events:auto}
.title{padding:0 12px; font-weight:400; font-size:16px; letter-spacing:-.005em; height:20px; line-height:20px; white-space:nowrap}
.items{display:flex; gap:12px; overflow-x:auto; width:100vw; padding:4px 0; scrollbar-width:none; scroll-snap-type:x mandatory; overscroll-behavior-x:contain}
.items::before,.items::after{content:''; flex:0 0 calc(50vw - 39px)}
.items::-webkit-scrollbar{display:none}
.item{position:relative; flex:0 0 auto; width:54px; height:54px; border-radius:50%; display:grid; place-items:center; scroll-snap-align:center}
.item .ring{position:absolute; inset:-1px; pointer-events:none}
.item.sel{background:rgba(255,255,255,.94); color:#111; border-color:transparent}
.item.on:not(.sel){background:rgba(255,255,255,.28)}
.item .num{position:absolute; font-weight:500; font-size:15px; font-variant-numeric:tabular-nums}
.scrub{width:100vw; height:40px; overflow:hidden; touch-action:none; cursor:ew-resize}
.scrub .strip{position:absolute; top:0; bottom:0; left:0; display:flex; align-items:center}
.scrub .tick{width:1px; height:12px; background:rgba(255,255,255,.6); margin-right:7px; flex:0 0 auto}
.scrub .tick.big{height:18px; background:#fff}
.scrub .mid{position:absolute; left:50%; top:7px; bottom:7px; width:2px; margin-left:-1px; background:#FFD60A; border-radius:1px}
.chips{display:flex; gap:6px; overflow-x:auto; width:100vw; height:40px; align-items:center; padding:0 16px; scrollbar-width:none; justify-content:safe center}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto; height:34px; padding:0 10px; white-space:nowrap; color:rgba(255,255,255,.6); font-size:15px}
.chip[aria-pressed="true"]{color:#fff; font-weight:500}
.swatches{display:flex; gap:8px; padding:5px 10px; border-radius:22px; align-items:center}
.sw{position:relative; width:28px; height:28px; border-radius:50%; border:1px solid rgba(255,255,255,.3); overflow:hidden; cursor:pointer; flex:0 0 auto; display:grid; place-items:center}
.sw input{position:absolute; inset:0; width:100%; height:100%; opacity:0; border:0; padding:0; cursor:pointer}
.sw.tool{background:none; color:#fff; font-size:17px; line-height:1}
.sw.tool.active{background:#fff; color:#111}
.sw.rm::after{content:'×'; color:#fff; font-size:16px; text-shadow:0 0 3px #000}
.tabs{display:flex; gap:2px; padding:6px; border-radius:30px}
.tab{width:68px; height:52px; border-radius:24px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; color:var(--soft); font-size:12px}
.tab svg{width:22px; height:22px}
.tab[aria-selected="true"]{color:#fff; background:rgba(255,255,255,.14)}
.hidden,[hidden]{display:none!important}
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 66px); transform:translateX(-50%); padding:7px 14px; border-radius:16px; z-index:6; pointer-events:none}
.toast[hidden]{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="out" aria-label="Artboard"></canvas>
<div class="empty" id="empty"><button class="glass" id="emptyUpload" aria-label="Upload an image"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2" />  <circle cx="9" cy="9" r="2" />  <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21" /></svg></button><span>Upload an image or video</span></div>
<p class="toast glass" id="toast" hidden></p>
<input id="file" type="file" accept="image/*,video/*" hidden>


<div class="vbar glass ui hidden" id="vbar"><button id="vplay" aria-label="Play" hidden></button><button id="vrec" aria-label="Record video" hidden></button><button id="vreset" aria-label="Reset all settings"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H3" />  <path d="M7 12H3" />  <path d="M7 19H3" />  <path d="M12 18a5 5 0 0 0 9-3 4.5 4.5 0 0 0-4.5-4.5c-1.33 0-2.54.54-3.41 1.41L11 14" />  <path d="M11 10v4h4" /></svg></button><button id="vupload" aria-label="Upload image or video"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10l-3.1-3.1a2 2 0 0 0-2.814.014L6 21" />  <path d="m14 19.5 3-3 3 3" />  <path d="M17 22v-5.5" />  <circle cx="9" cy="9" r="2" /></svg></button><button id="vdown" aria-label="Download"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3" />  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />  <path d="m7 10 5 5 5-5" /></svg></button></div>
<div class="topL glass ui hidden" id="topL"></div>
<div class="topR glass ui hidden" id="topR"></div>
<div class="xsheet hidden" id="xsheet" role="dialog" aria-label="Export">
  <div class="xhead"><span>Export</span><button id="xclose" aria-label="Close">×</button></div>
  <div class="seg" id="xkind"></div>
  <div class="xgroup" id="xfmtg"><div class="xlabel">Format</div><div class="seg" id="xfmt"></div></div>
  <div class="xgroup"><div class="xlabel">Size</div><div class="seg" id="xsize"></div></div>
  <p class="xinfo" id="xinfo"></p>
  <button class="xgo" id="xgo">Export</button>
</div>
<div class="dock ui hidden" id="dock">
  <div class="slot slot-sw"><div class="swatches glass hidden" id="swatches"></div></div>
  <div class="title" id="title"></div>
  <div class="items" id="items"></div>
  <div class="slot slot-ctl">
    <div class="scrub hidden" id="scrub"><div class="strip" id="strip"></div><div class="mid"></div></div>
    <div class="chips hidden" id="chips"></div>
  </div>
  <nav class="tabs glass" id="tabs" role="tablist"></nav>
</div>
